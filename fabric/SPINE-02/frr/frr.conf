frr version 10.7.1_git
frr defaults traditional
hostname SPINE-02
!
interface eth0
 ip address 10.0.0.9/30
exit
!
interface eth1
 ip address 10.0.0.13/30
exit
!
interface lo
 ip address 10.255.0.2/32
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 neighbor 10.0.0.10 remote-as 65000
 neighbor 10.0.0.14 remote-as 65000
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  neighbor 10.0.0.10 route-reflector-client
  neighbor 10.0.0.14 route-reflector-client
  neighbor 10.0.0.10 next-hop-self force
  neighbor 10.0.0.14 next-hop-self force
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.10 activate
  neighbor 10.0.0.14 activate
  neighbor 10.0.0.10 route-reflector-client
  neighbor 10.0.0.14 route-reflector-client
 exit-address-family
exit
!
