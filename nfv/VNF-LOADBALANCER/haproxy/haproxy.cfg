global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend netcloud_frontend
    bind 10.60.0.10:80
    default_backend netcloud_backends

backend netcloud_backends
    balance roundrobin
    server backend1 10.62.0.11:80 check
    server backend2 10.62.0.12:80 check
